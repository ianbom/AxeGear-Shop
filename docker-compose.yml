services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${APP_PORT:-80}:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.75'

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
      MYSQL_USER: '${DB_USERNAME:-sail}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    volumes:
      - sail-mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
      retries: 3
      timeout: 5s
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.50'

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - sail-redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      retries: 3
      timeout: 5s
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: '0.25'

  queue:
    image: sail-8.4/app
    depends_on:
      - mysql
      - redis
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --memory=256
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.50'

  scheduler:
    image: sail-8.4/app
    depends_on:
      - mysql
      - redis
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    command: php artisan schedule:work
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: '0.25'

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql-data:
    driver: local
  sail-redis-data:
    driver: local
